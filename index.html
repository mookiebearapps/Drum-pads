<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <!-- CRITICAL MOBILE TAGS: Prevents zooming, scaling, and scrolling -->
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
   
   <!-- PWA / Home Screen App tags -->
   <meta name="apple-mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
   <meta name="mobile-web-app-capable" content="yes">
   <meta name="theme-color" content="#121212">
   
   <title>Mobile Drum Pad</title>
   
   <style>
       /* Mobile Reset */
       * {
           box-sizing: border-box;
           -webkit-tap-highlight-color: transparent; /* Removes blue flash on Android */
           user-select: none; /* Prevents text selection */
           -webkit-user-select: none;
           touch-action: none; /* Prevents all browser scrolling and swiping */
       }

       body {
           background-color: #121212;
           color: #ffffff;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           margin: 0;
           padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
           height: 100vh;
           width: 100vw;
           display: flex;
           flex-direction: column;
           overflow: hidden;
       }

       header {
           text-align: center;
           padding: 15px 0;
           font-size: 1.2rem;
           font-weight: 800;
           letter-spacing: 2px;
           color: #00ffcc;
           text-transform: uppercase;
           box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
           z-index: 10;
           background: #1a1a1a;
       }

       .pad-container {
           flex: 1;
           display: grid;
           grid-template-columns: repeat(3, 1fr);
           grid-template-rows: repeat(3, 1fr);
           gap: 12px;
           padding: 15px;
           background: #0a0a0a;
       }

       .pad {
           background: linear-gradient(145deg, #2a2a2a, #1f1f1f);
           border: 2px solid #333;
           border-radius: 16px;
           display: flex;
           align-items: center;
           justify-content: center;
           font-size: 1.1rem;
           font-weight: bold;
           color: #888;
           box-shadow: 
               6px 6px 12px #050505, 
               -6px -6px 12px #2b2b2b;
           transition: background 0.05s, transform 0.05s, box-shadow 0.05s;
       }

       /* Active State - Lights up like an MPC pad */
       .pad.active {
           transform: scale(0.96);
           background: #00ffcc;
           color: #000;
           box-shadow: 0 0 20px #00ffcc;
           border-color: #ffffff;
       }

       #start-overlay {
           position: absolute;
           top: 0; left: 0; right: 0; bottom: 0;
           background: rgba(18, 18, 18, 0.95);
           display: flex;
           align-items: center;
           justify-content: center;
           z-index: 100;
       }

       .start-btn {
           background: #00ffcc;
           color: #000;
           border: none;
           padding: 20px 40px;
           font-size: 1.5rem;
           font-weight: bold;
           border-radius: 30px;
           box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
       }
   </style>
</head>
<body>

   <!-- Overlay required by browsers to unlock Web Audio on first user interaction -->
   <div id="start-overlay">
       <button class="start-btn" id="start-btn">TAP TO START</button>
   </div>

   <header>MPC Touch</header>

   <div class="pad-container" id="pad-container">
       <!-- Pads generated by JS -->
   </div>

<script>
let audioCtx;
let noiseBuffer;

// 1. Initialize Audio System ONLY after user taps (Mobile Browser Security Policy)
document.getElementById('start-btn').addEventListener('touchstart', initAudio);
document.getElementById('start-btn').addEventListener('click', initAudio);

function initAudio(e) {
   e.preventDefault();
   document.getElementById('start-overlay').style.display = 'none';
   
   const AudioContext = window.AudioContext || window.webkitAudioContext;
   audioCtx = new AudioContext();

   // Create noise buffer for snares and hats
   const bufferSize = audioCtx.sampleRate * 2;
   noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
   const output = noiseBuffer.getChannelData(0);
   for (let i = 0; i < bufferSize; i++) {
       output[i] = Math.random() * 2 - 1;
   }
}

// 2. Synthesizer Functions (Direct Web Audio API)
const sounds = {
   Kick: () => {
       const osc = audioCtx.createOscillator();
       const gainNode = audioCtx.createGain();
       osc.connect(gainNode);
       gainNode.connect(audioCtx.destination);

       const time = audioCtx.currentTime;
       osc.frequency.setValueAtTime(150, time);
       osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
       gainNode.gain.setValueAtTime(1, time);
       gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
       
       osc.start(time); osc.stop(time + 0.5);
   },
   Snare: () => {
       const osc = audioCtx.createOscillator();
       const oscGain = audioCtx.createGain();
       const noise = audioCtx.createBufferSource();
       const noiseGain = audioCtx.createGain();
       const filter = audioCtx.createBiquadFilter();

       noise.buffer = noiseBuffer;
       filter.type = 'highpass'; filter.frequency.value = 1000;

       osc.connect(oscGain); oscGain.connect(audioCtx.destination);
       noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);

       const time = audioCtx.currentTime;
       osc.type = 'triangle';
       osc.frequency.setValueAtTime(250, time);
       oscGain.gain.setValueAtTime(0.5, time);
       oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

       noiseGain.gain.setValueAtTime(1, time);
       noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

       osc.start(time); noise.start(time);
       osc.stop(time + 0.2); noise.stop(time + 0.2);
   },
   HiHatClosed: () => {
       const noise = audioCtx.createBufferSource();
       const noiseGain = audioCtx.createGain();
       const filter = audioCtx.createBiquadFilter();

       noise.buffer = noiseBuffer;
       filter.type = 'highpass'; filter.frequency.value = 5000;

       noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);

       const time = audioCtx.currentTime;
       noiseGain.gain.setValueAtTime(0.7, time);
       noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);

       noise.start(time); noise.stop(time + 0.05);
   },
   HiHatOpen: () => {
       const noise = audioCtx.createBufferSource();
       const noiseGain = audioCtx.createGain();
       const filter = audioCtx.createBiquadFilter();

       noise.buffer = noiseBuffer;
       filter.type = 'highpass'; filter.frequency.value = 5000;

       noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);

       const time = audioCtx.currentTime;
       noiseGain.gain.setValueAtTime(0.7, time);
       noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);

       noise.start(time); noise.stop(time + 0.3);
   },
   Clap: () => {
       const noise = audioCtx.createBufferSource();
       const noiseGain = audioCtx.createGain();
       const filter = audioCtx.createBiquadFilter();

       noise.buffer = noiseBuffer;
       filter.type = 'bandpass'; filter.frequency.value = 1500;

       noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);

       const time = audioCtx.currentTime;
       noiseGain.gain.setValueAtTime(0, time);
       noiseGain.gain.linearRampToValueAtTime(1, time + 0.01);
       noiseGain.gain.linearRampToValueAtTime(0, time + 0.02);
       noiseGain.gain.linearRampToValueAtTime(1, time + 0.03);
       noiseGain.gain.linearRampToValueAtTime(0, time + 0.04);
       noiseGain.gain.linearRampToValueAtTime(1, time + 0.05);
       noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

       noise.start(time); noise.stop(time + 0.2);
   },
   TomLow: () => {
       const osc = audioCtx.createOscillator();
       const gainNode = audioCtx.createGain();
       osc.connect(gainNode); gainNode.connect(audioCtx.destination);

       const time = audioCtx.currentTime;
       osc.frequency.setValueAtTime(100, time);
       osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
       gainNode.gain.setValueAtTime(1, time);
       gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
       
       osc.start(time); osc.stop(time + 0.5);
   },
   TomHigh: () => {
       const osc = audioCtx.createOscillator();
       const gainNode = audioCtx.createGain();
       osc.connect(gainNode); gainNode.connect(audioCtx.destination);

       const time = audioCtx.currentTime;
       osc.frequency.setValueAtTime(200, time);
       osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
       gainNode.gain.setValueAtTime(1, time);
       gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
       
       osc.start(time); osc.stop(time + 0.5);
   },
   Crash: () => {
       const noise = audioCtx.createBufferSource();
       const noiseGain = audioCtx.createGain();
       const filter = audioCtx.createBiquadFilter();

       noise.buffer = noiseBuffer;
       filter.type = 'highpass'; filter.frequency.value = 4000;

       noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);

       const time = audioCtx.currentTime;
       noiseGain.gain.setValueAtTime(0.8, time);
       noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 1.5);

       noise.start(time); noise.stop(time + 1.5);
   },
   Cowbell: () => {
       const osc1 = audioCtx.createOscillator();
       const osc2 = audioCtx.createOscillator();
       const gainNode = audioCtx.createGain();
       
       osc1.type = 'square'; osc2.type = 'square';
       osc1.frequency.value = 800; osc2.frequency.value = 540;

       osc1.connect(gainNode); osc2.connect(gainNode);
       gainNode.connect(audioCtx.destination);

       const time = audioCtx.currentTime;
       gainNode.gain.setValueAtTime(0.5, time);
       gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.3);

       osc1.start(time); osc2.start(time);
       osc1.stop(time + 0.3); osc2.stop(time + 0.3);
   }
};

// 3. Layout Configuration (Standard MPC style bottom-to-top layout)
const padsConfig = [
   { sound: 'Crash', label: 'CRASH' },
   { sound: 'TomHigh', label: 'TOM HI' },
   { sound: 'HiHatOpen', label: 'OPEN HAT' },
   { sound: 'TomLow', label: 'TOM LOW' },
   { sound: 'Snare', label: 'SNARE' },
   { sound: 'HiHatClosed', label: 'CLOSED HAT' },
   { sound: 'Kick', label: 'KICK' },
   { sound: 'Clap', label: 'CLAP' },
   { sound: 'Cowbell', label: 'COWBELL' }
];

// 4. Generate Pads & Attach Mobile Touch Events
const container = document.getElementById('pad-container');

padsConfig.forEach(config => {
   const pad = document.createElement('div');
   pad.className = 'pad';
   pad.textContent = config.label;
   container.appendChild(pad);

   const triggerSound = (e) => {
       e.preventDefault(); // STOPS screen scrolling/zooming immediately
       if(!audioCtx) return;

       // Wake up audio context if iOS paused it
       if (audioCtx.state === 'suspended') audioCtx.resume();
       
       sounds[config.sound]();
       
       // UI Feedback
       pad.classList.add('active');
   };

   const releaseSound = (e) => {
       e.preventDefault();
       pad.classList.remove('active');
   };

   // Mobile specific events (zero latency compared to 'click')
   pad.addEventListener('touchstart', triggerSound, { passive: false });
   pad.addEventListener('touchend', releaseSound, { passive: false });
   pad.addEventListener('touchcancel', releaseSound, { passive: false });

   // Fallback for desktop testing
   pad.addEventListener('mousedown', triggerSound);
   pad.addEventListener('mouseup', releaseSound);
   pad.addEventListener('mouseleave', releaseSound);
});

// Prevent multi-touch zooming gestures on the whole document
document.addEventListener('gesturestart', function(e) {
   e.preventDefault();
});
</script>
</body>
</html>
